[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "chessbot"
version = "0.1.0"
description = "Tested SO-ARM101 chess-robot stack with calibration, kinematics, motion choreography, and mock hardware"
requires-python = ">=3.10"
dependencies = [
    "chess>=1.10",   # python-chess: game state, legal moves, special-move detection
    "numpy>=1.24",   # board<->robot transform math
    "pyyaml>=6.0",   # config/board.local.yaml
]

[project.optional-dependencies]
# Only needed to drive the physical arm. Reuses your lerobot-experiments stack;
# you can also just run hardware scripts with that venv instead of installing here.
hardware = ["lerobot>=0.5; python_version >= '3.12'", "feetech-servo-sdk", "ikpy"]  # feetech-servo-sdk: STS3215 driver (scservo_sdk); ikpy: pure-Python IK
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]
