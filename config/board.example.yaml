# Copy to config/board.local.yaml and fill in measured values for your setup.
# All coordinates are in meters, in the board frame (origin = center of a1,
# +x toward h1, +y toward a8). board.local.yaml is gitignored.

square_size_m: 0.04          # measure your board's square size

# Board-frame -> robot-frame transform. Produce these numbers by running
# scripts/calibrate_board.py on the arm. Defaults below are identity (only
# meaningful once calibrated).
transform:
  scale: 1.0
  theta_rad: 0.0
  flip: 1                    # +1 normal, -1 if your board is mirrored vs the arm
  offset: [0.0, 0.0]

heights:
  table_z: 0.02              # robot-frame height of the board surface
  grasp_lift: 0.0            # global trim added to every grab height
  hover: 0.08                # travel clearance above the grip point — a carried
                             # piece hangs below the jaws, so keep this taller
                             # than your king, plus a little margin

# Full piece heights in meters — measure YOURS base-to-tip with a ruler.
# The jaws close grip_below_top_m below each piece's tip (under the head/collar,
# where the head above keeps the piece from slipping out).
pieces:
  heights_m:
    P: 0.032
    N: 0.045
    B: 0.050
    R: 0.040
    Q: 0.058
    K: 0.065
  grip_below_top_m: 0.012
  min_z_m: 0.008             # never grab lower than this (protects jaws vs. board)

# Where captured pieces and spare promotion pieces live (board-frame x, y).
offboard:
  graveyard:
    - [-0.05, 0.00]
    - [-0.05, 0.04]
    - [-0.05, 0.08]
    - [-0.05, 0.12]
  spares:
    Q:
      - [-0.13, 0.00]

arm:
  follower_port: "TODO"      # from: python scripts/find_port.py
  robot_id: "chessbot_follower"
  urdf_path: "urdf/SO101/so101_new_calib.urdf"   # bundled SO-101 model; usually leave as-is
  gripper_open: 60.0         # tune with scripts/gripper_test.py
  gripper_closed: 10.0
